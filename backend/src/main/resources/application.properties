spring.application.name=securevault-backend

# Server Configuration
server.port=8080

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/securevault_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Security Secrets (JWT & AES-256 Key)
# 256-bit AES Key encoded in Base64 (or 32-byte secret string)
securevault.security.jwt.secret=9a2f8c4e7b1d3f6a8b5c2d9e1f4a7b0c3d6e9f2a5b8c1d4e7f0a3b6c9d2e5f8a
securevault.security.jwt.expiration-ms=86400000
